<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f1a"/>
      <stop offset="1" stop-color="#04080d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- rede: linhas ligando os vértices ao centro -->
  <g stroke="#10b981" stroke-opacity="0.35" stroke-width="10">
    <line x1="256" y1="76" x2="256" y2="190"/>
    <line x1="412" y1="166" x2="318" y2="220"/>
    <line x1="412" y1="346" x2="318" y2="292"/>
    <line x1="256" y1="436" x2="256" y2="330"/>
    <line x1="100" y1="346" x2="194" y2="292"/>
    <line x1="100" y1="166" x2="194" y2="220"/>
  </g>
  <!-- hexágono -->
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linejoin="round"/>
  <!-- nós nos vértices -->
  <g fill="#34d399">
    <circle cx="256" cy="76" r="20"/>
    <circle cx="412" cy="166" r="20"/>
    <circle cx="412" cy="346" r="20"/>
    <circle cx="256" cy="436" r="20"/>
    <circle cx="100" cy="346" r="20"/>
    <circle cx="100" cy="166" r="20"/>
  </g>
  <!-- cadeado -->
  <path d="M214 236 v-28 a42 42 0 0 1 84 0 v28" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round"/>
  <rect x="190" y="232" width="132" height="104" rx="22" fill="#38bdf8"/>
  <circle cx="256" cy="274" r="15" fill="#04080d"/>
  <rect x="249" y="280" width="14" height="32" rx="6" fill="#04080d"/>
</svg>
